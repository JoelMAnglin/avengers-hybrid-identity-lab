name: avengers-identity-observability
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml','--storage.tsdb.retention.time=7d']
    ports: ['127.0.0.1:9090:9090']
    volumes: ['./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro','prometheus-data:/prometheus']
    restart: unless-stopped
  loki:
    image: grafana/loki:3.5.3
    command: ['-config.file=/etc/loki/config.yml']
    ports: ['127.0.0.1:3100:3100']
    volumes: ['./docker/loki/config.yml:/etc/loki/config.yml:ro','loki-data:/loki']
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.10.0
    command: ['run','/etc/alloy/config.alloy','--server.http.listen-addr=0.0.0.0:12345']
    volumes: ['./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro']
    extra_hosts: ['host.docker.internal:host-gateway']
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    ports: ['127.0.0.1:3000:3000']
    environment: ['GF_USERS_ALLOW_SIGN_UP=false','GF_AUTH_ANONYMOUS_ENABLED=false']
    volumes: ['./docker/grafana/provisioning:/etc/grafana/provisioning:ro','grafana-data:/var/lib/grafana']
    depends_on: [prometheus,loki]
    restart: unless-stopped
volumes:
  prometheus-data:
  loki-data:
  grafana-data:

